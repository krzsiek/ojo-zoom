      # libVLC 2.1.12 was only published on JCenter (shut down) -> build it from its original source
      - name: Add libVLC 2.1.12 as local module
        run: |
          git clone https://github.com/mrmaffen/vlc-android-sdk /tmp/vlcsdk
          git -C /tmp/vlcsdk checkout 769f365
          mkdir -p libvlc/src/main
          cp -r /tmp/vlcsdk/libvlc-android/src/main/java /tmp/vlcsdk/libvlc-android/src/main/jniLibs libvlc/src/main/
          find libvlc -name '*.java' -exec sed -i 's/android\.support\.annotation/androidx.annotation/g' {} +
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" />' > libvlc/src/main/AndroidManifest.xml
          cat > libvlc/build.gradle <<'EOF_GRADLE'
          plugins {
              id 'com.android.library'
          }
          android {
              namespace 'org.videolan.libvlc'
              compileSdkVersion 33
              defaultConfig {
                  minSdkVersion 15
                  targetSdkVersion 33
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lintOptions {
                  abortOnError false
              }
          }
          dependencies {
              implementation 'androidx.annotation:annotation:1.6.0'
          }
          EOF_GRADLE
          echo "include ':libvlc'" >> settings.gradle
          sed -i "s|implementation 'de.mrmaffen:libvlc-android:2.1.12@aar'|implementation project(':libvlc')\\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')|" app/build.gradle
          sed -i '/jcenter()/d' build.gradle
          grep -n "libvlc" app/build.gradle settings.gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          tail -n 150 build.log
          if [ $rc -ne 0 ]; then
            # Put the important part of the error on the run summary page
            grep -n -E "error:|warning: \\[|What went wrong|Could not|Execution failed|Caused by|^> [^T]|FAILURE" build.log | grep -v "^\s*$" | head -n 80 > err.txt
            {
              echo '## Build error'
              echo '```'
              cat err.txt
              echo '```'
              echo '## Last 60 lines of log'
              echo '```'
              tail -n 60 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(head -n 25 err.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $rc

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v5
        with:
          name: ojo-zoom-apk
          path: app/build/outputs/apk/debug/*.apk
