name: Build APK

# Every push builds the APK and keeps it as a workflow artifact.
# Pushing a tag like v0.2.0 also publishes a GitHub release with the APK attached.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Optional: a stable release key from repository secrets, so installed copies can be updated.
      # Without the secrets the APK is signed with the runner's throwaway debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OJO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OJO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key found"
          else
            echo "::warning title=No release key::Secret OJO_KEYSTORE_BASE64 not set, APK signed with a debug key"
          fi

      - name: Build release APK
        env:
          OJO_KEYSTORE_PASSWORD: ${{ secrets.OJO_KEYSTORE_PASSWORD }}
          OJO_KEY_ALIAS: ${{ secrets.OJO_KEY_ALIAS }}
          OJO_KEY_PASSWORD: ${{ secrets.OJO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          tail -n 150 build.log
          if [ $rc -ne 0 ]; then
            # Put the important part of the error on the run summary page
            grep -n -E "error:|warning: \\[|What went wrong|Could not|Execution failed|Caused by|^> [^T]|FAILURE" build.log | grep -v "^\s*$" | head -n 80 > err.txt
            {
              echo '## Build error'
              echo '```'
              cat err.txt
              echo '```'
              echo '## Last 60 lines of log'
              echo '```'
              tail -n 60 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(head -n 25 err.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $rc

      - name: Name the APK
        run: |
          version=$(grep -m1 versionName app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/ojo-zoom-$version.apk"
          ls -la dist

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v5
        with:
          name: ojo-zoom-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: RELEASE_NOTES.md
